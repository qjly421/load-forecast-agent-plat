profile_id: formal_jun2026_d1d5
display_name: Shandong D1-D5 Target-Day Formal June 2026
benchmark_type: shandong_targetday_d1d14
benchmark_version: v1

data:
  load_path: data/load_sd.parquet
  weather_root: data/shandong
  weather_source: ec
  merged_cache_root: ./cache/merged_data
  data_protocol: shandong_handoff_d0_d14_raw

contract:
  history_len_points: 672
  gap_len_points: 96
  pred_len_points: 480
  step_points_per_day: 96
  pred_days: 5
  validation_origin_days: 7
  rolling_interval_days: 7
  primary_metrics:
    - overall_acc
    - mid_acc
    - night_acc
  official_files:
    - formal_summary.yaml
    - target_day_summary.csv
  archive_root: ./archive

model_defaults:
  nn:
    default_backbone_id: tsingroc_dlinearbasictime_combined
    backbone_configs:
      tsingroc_dlinearbasictime_combined:
        config_path: ./config/model/nn_targetday_native_dlinear.yaml
        native_model_contract:
          backbone_type: dlinearbasictime
          normalization_method: combined
          seq_len: 672
          gap_steps: 96
          pred_len: 1344
          only_output_after_gap: false
          day2_weight: 1.0
          midday_penalty: 1.0
          time_embedding_type: BaseTimeEmbedding
          use_multi_point_weather: false
          use_holiday_features: false
          source_native_config_template: repo-benchmark-14days/config/shandong_dayahead_fivepoint.yaml
      tsingroc_baseline_combined:
        config_path: ./config/model/nn_targetday_native_baseline.yaml
        native_model_contract:
          backbone_type: baseline
          normalization_method: combined
          seq_len: 672
          gap_steps: 96
          pred_len: 1344
          only_output_after_gap: false
          day2_weight: 1.0
          midday_penalty: 1.0
          time_embedding_type: BaseTimeEmbedding
          use_multi_point_weather: false
          use_holiday_features: false
          source_native_config_template: repo-benchmark-14days/config/shandong_dayahead_fivepoint.yaml
      legacy_targetday_dlinear:
        config_path: ./config/model/nn_targetday_dlinear.yaml
        native_model_contract:
          backbone_type: legacy_targetday_dlinear
          normalization_method: combined
          seq_len: 672
          gap_steps: 96
          pred_len: 1344
          only_output_after_gap: false
          day2_weight: 1.0
          midday_penalty: 1.0
          time_embedding_type: FutureTimeEmbedding
          use_multi_point_weather: false
          use_holiday_features: false
          source_native_config_template: shandong_targetday_benchmark/config/model/nn_targetday_dlinear.yaml
  lgb:
    config_path: ./config/model/lgb_targetday.yaml

reproducibility:
  seed: 3407
  pythonhashseed: "3407"
  cublas_workspace_config: ":4096:8"
  deterministic_torch: true
  tf32_disabled: true

machine_plan:
  stage1:
    nn: dl4
    lgb: rl3
  stage2:
    nn: rl3
    lgb: tr2
  stage3:
    nn: rl3
    lgb: tr2
  stage4:
    nn: dl4
    lgb: rl3

machine_roots: {}

stage_defaults:
  stage1:
    strategy_id: direct_d14
    rolling_retrain: false
    segmented: false
  stage2:
    strategy_id: weekly_rolling_direct_d14
    rolling_retrain: true
    segmented: false
  stage3:
    strategy_id: segmented_stitched_d14
    rolling_retrain: false
    segmented: true
    segment_ranges:
      - [1, 5]
      - [6, 10]
      - [11, 14]
  stage4:
    strategy_id: direct_d14
    rolling_retrain: false
    segmented: false

points:
  - point_id: jun2026
    target_start: 2026-06-01
    target_end: 2026-06-30
    label: 2026-06

output:
  result_root: ./results/formal_targetday_shandong
  run_name_template: "{profile_id}_{stage}_{model_family}_{timestamp}"
